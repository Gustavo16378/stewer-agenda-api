# =====================================================================
# Stewer Agenda API
#
# Tres profiles:
#   (sem prefixo) valores comuns a todo mundo
#   %dev          aponta pro PostgreSQL do docker-compose deste repo
#   %prod         le tudo de variavel de ambiente (padrao Railway)
#   %test         nao configura datasource de proposito: assim o Quarkus
#                 sobe um PostgreSQL 16 descartavel via Dev Services
# =====================================================================

quarkus.application.name=stewer-agenda-api
quarkus.http.port=8080
quarkus.http.root-path=/

# ---------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/stewer_agenda
%dev.quarkus.datasource.username=stewer
%dev.quarkus.datasource.password=stewer

# No Railway o DATABASE_URL costuma vir como postgresql://user:pass@host/db;
# converta para o formato JDBC antes de injetar (veja o README).
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USERNAME}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}
%prod.quarkus.datasource.jdbc.max-size=16
%prod.quarkus.http.port=${PORT:8080}

# Dev Services (usado apenas em %test, que nao define jdbc.url)
quarkus.datasource.devservices.image-name=postgres:16-alpine

# ---------------------------------------------------------------------
# Hibernate ORM
# O schema e responsabilidade exclusiva do Flyway; o Hibernate nunca
# cria nem altera tabela.
# ---------------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=none

# NAO defina quarkus.hibernate-orm.jdbc.timezone=UTC aqui.
#
# Parece inofensivo, mas ele faz o driver converter as colunas "time" pelo fuso
# da JVM: a grade gravada como 09:00 volta como 06:00 numa maquina em UTC-3.
# Os instantes ja sao timestamptz (absolutos por definicao), entao a propriedade
# nao acrescenta nada -- so quebra a hora de parede da disponibilidade.
# DisponibilidadeSeedTimezoneTest existe justamente para travar essa regressao.
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.sql=false

# ---------------------------------------------------------------------
# Flyway
#
# ATENCAO: quarkus.flyway.locations e resolvido em tempo de build (o
# Quarkus "assa" a lista de arquivos no artefato). Por isso o seed de dev
# vive em db/seed, um diretorio IRMAO de db/migration -- se estivesse
# aninhado dentro dele, o scan recursivo o levaria para prod tambem.
# ---------------------------------------------------------------------
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.clean-at-start=false

# dev = schema + seed
%dev.quarkus.flyway.locations=classpath:db/migration,classpath:db/seed

# test = schema puro, identico ao de prod
%test.quarkus.flyway.locations=classpath:db/migration

# prod nunca pode limpar o banco, nem por variavel de ambiente
%prod.quarkus.flyway.clean-disabled=true

# ---------------------------------------------------------------------
# Tenant
#
# Endpoints publicos (registrar/login) caem neste slug quando o cliente nao
# informa outro. Um estabelecimento hoje, N amanha sem mudar codigo.
# ---------------------------------------------------------------------
stewer.tenant.slug-padrao=${TENANT_SLUG_PADRAO:stewer-gabriel}

# ---------------------------------------------------------------------
# Bootstrap: deixa um banco recem-criado utilizavel
#
# Em producao o Flyway so aplica db/migration, que e DDL puro -- o seed com o
# estabelecimento e os usuarios fica em db/seed e so roda em dev. Sem isto, um
# deploy novo sobe verde e o primeiro cadastro responde 404 "Estabelecimento
# nao encontrado".
#
# BootstrapEstabelecimento cria o que faltar na subida, lendo daqui. E
# idempotente e nao sobrescreve nada que ja exista.
#
# O admin inicial e opcional. Informando o e-mail, a senha passa a ser
# obrigatoria (minimo 8 caracteres) e sai de variavel de ambiente -- nunca do
# repositorio. Depois do primeiro boot as duas variaveis podem ser removidas.
# ---------------------------------------------------------------------
stewer.bootstrap.habilitado=${BOOTSTRAP_HABILITADO:true}
stewer.bootstrap.tenant.slug=${BOOTSTRAP_TENANT_SLUG:}
stewer.bootstrap.tenant.nome=${BOOTSTRAP_TENANT_NOME:Estabelecimento}
stewer.bootstrap.tenant.fuso=${BOOTSTRAP_TENANT_FUSO:America/Araguaina}
stewer.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
stewer.bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NOME:Administrador}
stewer.bootstrap.admin.senha=${BOOTSTRAP_ADMIN_SENHA:}

# Em teste cada classe monta o cenario de que precisa; um tenant extra criado
# na subida so atrapalharia. Quem precisa do bootstrap liga no proprio profile.
%test.stewer.bootstrap.habilitado=false

# ---------------------------------------------------------------------
# JWT (HS256 com segredo compartilhado)
# ---------------------------------------------------------------------
stewer.jwt.issuer=${JWT_ISSUER:https://stewer-agenda-api}
stewer.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:28800}

# O segredo HMAC NAO tem default fora de dev e de teste.
#
# Este repositorio e publico: um default sem prefixo de profile faria um deploy
# que esquecesse JWT_SECRET subir assinando token com uma string que qualquer um
# le no GitHub -- e forja token de ADMIN. Em prod o valor fica vazio de
# proposito, e TokenService recusa o boot com uma mensagem dizendo o que fazer.
#
# Os segredos de dev e de teste tambem sao publicos, e tudo bem: eles so assinam
# token para um banco local descartavel. O que nao pode e um deles alcancar
# producao -- TokenService tambem recusa isso.
stewer.jwt.secret=${JWT_SECRET:}
%dev.stewer.jwt.secret=${JWT_SECRET:D6w42/Ajia/d6expDVc90K3JNR9PiMDBf1WFPfPQBFN+pKCqGNGybRArbc1YpELg}
%test.stewer.jwt.secret=${JWT_SECRET:AEI426bRjR0XKMn782pfDDpO7k+VhYZ73WkAW/KPZgDW/dwYMYkOUdTCPWM3nO+b}

mp.jwt.verify.issuer=${stewer.jwt.issuer}

# Chave simetrica: precisa ser smallrye.jwt.verify.secretkey.
# mp.jwt.verify.publickey NAO serve aqui -- o SmallRye tenta parsear aquele
# valor como chave PEM/JWK publica e falha antes de chegar no HMAC.
# JwtSecretConfigInterceptor converte o segredo em texto puro para o JWK que o
# SmallRye exige. As duas linhas abaixo so precisam existir para que a
# propriedade seja consultada -- o valor final vem do interceptor.
smallrye.jwt.verify.secretkey=${stewer.jwt.secret}
smallrye.jwt.sign.key=${stewer.jwt.secret}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.new-token.lifespan=${stewer.jwt.expiracao-segundos}

# ---------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.serialization-inclusion=non-null

# ---------------------------------------------------------------------
# OpenAPI / Swagger UI
# Em dev: http://localhost:8080/q/swagger-ui
# ---------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Stewer Agenda API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de agendamento do estudio de visagismo e consultoria de imagem.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.auto-add-security=false
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.title=Stewer Agenda API

# ---------------------------------------------------------------------
# Log
# ---------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."dev.gustavo.stewer".level=DEBUG
%prod.quarkus.log.category."dev.gustavo.stewer".level=INFO
