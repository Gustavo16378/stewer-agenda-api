name: CI

# Roda a suite inteira (com cobertura) e monta a imagem de producao. Nada e
# publicado: o deploy quem faz e o Render, a partir do push na main.
#
# O app (stewer-agenda-app) roda as jornadas E2E contra a main desta API.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Maven + PostgreSQL)
    runs-on: ubuntu-latest

    # A imagem oficial do Postgres ja traz o btree_gist, que a migration V4
    # precisa. Em teste o Quarkus subiria um container proprio via Dev
    # Services, mas aqui apontamos para este: o CI roda em container e
    # Testcontainers dentro de Actions e mais lento e mais fragil.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stewer_teste
          POSTGRES_USER: stewer
          POSTGRES_PASSWORD: stewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stewer -d stewer_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Testes
        # O profile de teste nao define datasource de proposito (para usar Dev
        # Services localmente). Aqui apontamos para o service container, e o
        # Quarkus usa este em vez de subir outro.
        run: >-
          ./mvnw -B test
          -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/stewer_teste
          -Dquarkus.datasource.username=stewer
          -Dquarkus.datasource.password=stewer

      - name: Cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          raiz = ET.parse('target/jacoco-report/jacoco.xml').getroot()
          print('### Cobertura (JaCoCo)\n\n| | % | cobertos |\n|---|---|---|')
          for c in raiz.findall('counter'):
              if c.get('type') in ('LINE', 'BRANCH', 'METHOD', 'CLASS'):
                  ok, falta = int(c.get('covered')), int(c.get('missed'))
                  nome = {'LINE': 'Linhas', 'BRANCH': 'Ramos', 'METHOD': 'Metodos', 'CLASS': 'Classes'}[c.get('type')]
                  print(f'| {nome} | {100 * ok / (ok + falta):.1f}% | {ok}/{ok + falta} |')
          PY

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cobertura-api
          path: target/jacoco-report
          retention-days: 14

      - name: Relatorio dos testes
        if: always()
        run: |
          echo "### Testes" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/surefire-reports/*.txt \
            | sed 's/, Time.*//' \
            | awk -F'[ ,]' '{t+=$3; f+=$6; e+=$9} END {
                printf "- %d testes, %d falhas, %d erros\n", t, f, e }' \
            >> "$GITHUB_STEP_SUMMARY"

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O driver padrao do Docker nao exporta cache ("Cache export is not
      # supported for the docker driver"). O buildx com o driver
      # docker-container resolve, e e o que permite reaproveitar as camadas
      # entre execucoes.
      - name: Preparar o buildx
        uses: docker/setup-buildx-action@v3

      - name: Monta a imagem de producao
        # Sem push: o objetivo e descobrir Dockerfile quebrado no PR, e nao no
        # deploy. O Render faz o build dele a partir do mesmo arquivo.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stewer-agenda-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
